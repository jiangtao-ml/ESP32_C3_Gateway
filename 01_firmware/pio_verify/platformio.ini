; ============================================================================
; pio_verify —— PlatformIO 并行验证工程（**只编译、不烧录**）
;
; 目的：在不改动现有 Arduino 工程（01_firmware/esp32c3_gateway/）的前提下，
;       用 PlatformIO 编译**同一份源码**，比对产物体积与警告，判断迁移是否"零差异"。
;
; 依据：02_docs/16_数据落地与商业化设计.md §9.5（PlatformIO 迁移）
;
; ⚠️ 三个必须显式锁定的点（否则会重演 esp-rv32 那次排障）：
;    1) platform / core 版本 —— 见下方 platform 行，**改它等于换 core**
;    2) 编译选项 —— CDCOnBoot=cdc（USB CDC On Boot）必须开，否则 Serial 会占 GPIO20/21
;    3) 分区表 / Flash 容量 —— 必须与 Arduino IDE 当前设置一致
; ============================================================================

[env:esp32c3]
; --- core 版本：先按 PlatformIO 默认（espressif32 = arduino-esp32 2.x，即老师那套）验证 ---
;     若要匹配我们 Arduino IDE 现在的 3.3.10（IDF 5.x），需换 pioarduino 的 3.x platform。
;     ⚠️ 2026-10-05 实测：本平台声明要 framework-arduinoespressif32 ~4.20017.0（= arduino-esp32 2.0.17 那一代），
;        而我们的 Arduino IDE 用 3.3.10 ⇒ **迁移不是"零差异"，而是"换 core"**（详见 02_docs/16 §9.5.3）。
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino

; --- 与 Arduino IDE 的 Tools 菜单对齐 ---
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L

; --- USB CDC On Boot = Enabled  ⇒  Serial 走原生 USB CDC，而不是 UART0(GPIO20/21) ---
; ⚠️ 2026-10-05 实测追加：`src/main.cpp` 只 include 了 `../esp32c3_gateway/esp32c3_gateway.ino`，
;    而该 .ino **在 src/ 之外** ⇒ PlatformIO 的库依赖扫描器（LDF）**看不到它里面的 `#include <WiFi.h>`**
;    ⇒ 报 `fatal error: WiFi.h: No such file or directory`（框架核心本身编得过）。
;    这里把 LDF 模式放宽一层。**这本身是"只 include 外部 .ino"这种骨架的真实迁移成本之一。**
lib_ldf_mode = deep+

build_flags =
    -I${PROJECT_DIR}/../esp32c3_gateway
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/libraries/WiFi/src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; ============================================================================
; 2026-10-05 追加：两个大包改为**本地预置**（不再走 platform_packages 覆盖）
;
; 过程与理由（实测）：
;   1) PlatformIO 官方 CDN 在国内实测 ≈14 KB/s ⇒ 工具链 200 MB+ 要下 4 小时；
;   2) 改用 `platform_packages = ... @ <乐鑫 CN CDN URL>` 后**下载很快（2.1 MB/s，快 150×）**，
;      但乐鑫给的是 **Espressif 原版包**，包根缺少 PlatformIO 要求的 `package.json` 清单 ⇒
;      `MissingPackageManifestError: Could not find one of 'package.json' manifest files in the package`；
;   3) ⇒ 改为**离线预置**：用 `06_tests/pio_cn_seed.py` 把两个包解压进
;      `~/.platformio/packages/`（自动拍平多余的一层顶层目录 + 写入 `package.json` / `.piopm`）。
;      完成后 PlatformIO 视为"已安装"，**不再下载**。
;
; ⚠️ 已就位（2026-10-05，实测）：
;      toolchain-riscv32-esp        908 MB  bin/riscv32-esp-elf-gcc-8.4.0.exe ✓
;      framework-arduinoespressif32 703 MB  cores/ libraries/ tools/ variants/ ✓
;
; ⚠️ 网传的"清华 / 阿里云 PlatformIO 镜像"**全部 404，不存在**，勿再尝试。
; ⚠️ 本平台声明的 framework 是 ~4.20017.0（arduino-esp32 2.0.17 那一代），
;     而我们的 Arduino IDE 用 3.3.10 ⇒ **迁移不是"零差异"，而是"换 core"**（见 02_docs/16 §9.5.3）。
; ----------------------------------------------------------------------------
; platform_packages =
;     espressif/toolchain-riscv32-esp @ https://dl.espressif.cn/github_assets/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/riscv32-esp-elf-gcc8_4_0-esp-2021r2-patch5-win64.zip
;     espressif/framework-arduinoespressif32 @ https://dl.espressif.cn/github_assets/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip

monitor_speed = 115200
upload_speed = 921600
