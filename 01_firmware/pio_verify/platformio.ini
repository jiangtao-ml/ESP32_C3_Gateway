; ============================================================================
; pio_verify —— PlatformIO 并行验证工程（**只编译、不烧录**）
;
; 目的：在不改动现有 Arduino 工程（01_firmware/esp32c3_gateway/）的前提下，
;       用 PlatformIO 编译**同一份源码**，比对产物体积与警告，判断迁移是否"零差异"。
;
; 依据：02_docs/16 §9.5（PlatformIO 迁移）· 02_docs/19（core 选型）· 02_docs/20（国内镜像）
;
; ============================================================================
; 2026-10-06 迁移记录（砚青）：**平台已由官方 espressif32@7.1.3（= arduino-esp32 2.0.17）
;   切换到 pioarduino 55.03.311（= Arduino 3.3.11 / IDF 5.5.5）**
;
;   依据（见 02_docs/19）：① 板子现跑 3.3.10，M0–M5 全在其上验证 ⇒ 换回 2.0.17 = 作废；
;                          ② 2.0.17 已 EOL、无安全补丁（商业化不可接受）；
;                          ③ 本固件不碰任何 3.x 破坏性 API（已 API 审计）；
;                          ④ 批次 3 的 Web 配置页在 2.0.17 上缺 Network.h、走不通。
;
;   ⚠️ **为什么是 3.3.11 而不是 3.3.10**：pioarduino **未发布 3.3.10**
;      （tag 序列 …55.03.39=3.3.9 → 55.03.311=3.3.11 → 55.03.312=3.3.12），
;      故取**最接近的 3.3.11**；与板子 3.3.10 存在 **1 个 patch 差异**，
;      由"迁移后一次对照验证"覆盖（02_docs/19 §3.2 第 4 条）。
;
;   ⚠️ 平台与工具链**不在本工程内**：由 `06_tests/pio_cn_seed.py --set c3` 预置到
;      `~/.platformio/{platforms,packages}`（走 CN 通道，绕过不可达的 github.com）。
;      `platform = espressif32` 指向的就是那份**本地已装**的平台。
; ============================================================================

[env:esp32c3]
; --- core：pioarduino 55.03.311 = Arduino 3.3.11 / IDF 5.5.5 ---
;     ⚠️ 不要改回 `espressif32@7.x`（那是 arduino-esp32 2.0.17，与板子不同代）。
;     3.x 官方 PlatformIO 不支持，只能走 pioarduino（社区 fork）。
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; --- 与 Arduino IDE 的 Tools 菜单对齐 ---
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L

; --- LDF 模式：只能用 deep / chain，**禁止带 "+"**（2026-10-07 实测 + 上游 issue 实证） ---
; ⚠️ 3.x 坑（espressif/arduino-esp32#9782）：`deep+`/`chain+` 的宏预处理器求值
;    与 3.x 网络层重构冲突 ⇒ WiFi 库编译报 `fatal error: Network.h: No such file or
;    directory`（LDF 把 Networking 平级化，WiFi 编译时拿不到 Network 头文件路径）。
;    去掉 "+"（用 deep）即正常。**2.x 无此问题**，这是 3.x 特有。
; ⚠️ 历史坑（2026-10-05）：`src/main.cpp` 只 include 了 `../esp32c3_gateway/esp32c3_gateway.ino`，
;    而该 .ino 在 src/ 之外 ⇒ LDF 可能看不到其中的 `#include <WiFi.h>`
;    ⇒ 编译报 `WiFi.h: No such file or directory`。
;    由下方 build_flags 的 `-I.../libraries/WiFi/src` 兜底（编译期），LDF 用 deep 递归扫描。
lib_ldf_mode = deep

build_flags =
    -I${PROJECT_DIR}/../esp32c3_gateway
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/libraries/WiFi/src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600

; ============================================================================
; 附：2.0.17 时代的 `platform_packages` 覆盖（已废弃，保留作历史参考）
;
;   2026-10-05 实测：PlatformIO 官方 CDN 国内 ≈14 KB/s；改用 `platform_packages = ... @
;   <乐鑫 CN CDN URL>` 后很快（2.1 MB/s），但乐鑫给的是 **Espressif 原版包**，包根缺
;   PlatformIO 要求的 `package.json` ⇒ `MissingPackageManifestError`。
;   ⇒ 最终改为**离线预置**（`06_tests/pio_cn_seed.py`：下载 → 拍平 → 补清单）。
;
;   ⚠️ 网传"清华 / 阿里云 PlatformIO 镜像"**全部 404，不存在**。
;   ⚠️ 现行方案与逐包通道表见 `02_docs/20_工具链国内镜像与离线安装_2026-10-06.md`。
; ----------------------------------------------------------------------------
; platform_packages =
;     espressif/toolchain-riscv32-esp @ https://dl.espressif.cn/github_assets/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/riscv32-esp-elf-gcc8_4_0-esp-2021r2-patch5-win64.zip
;     espressif/framework-arduinoespressif32 @ https://dl.espressif.cn/github_assets/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
; ============================================================================
