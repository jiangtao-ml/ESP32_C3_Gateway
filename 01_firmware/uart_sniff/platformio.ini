; uart_sniff —— ESP32 侧「只听不发」原始字节监听（诊断用，不是业务固件）
; 目的：排除总线冲突后，测 A/B 链路的**真实**误码率。
;       业务固件每秒发 3 帧，注入测试时两边撞车会把「链路问题」和「冲突」混在一起。

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600
