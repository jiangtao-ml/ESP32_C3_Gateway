; ============================================================================
; pin_diag —— GPIO21 输出能力 + W4 导通 + 短路 三合一诊断（**只诊断、不是业务固件**）
;
; 回答三个问题（无需万用表）：
;   Q1 GPIO21 引脚本身坏没坏（输出级能不能真的驱动）   -> T1 自驱 readback
;   Q2 GPIO21 有没有被短到 3.3V/5V/GND（交叉点压破）   -> T2 弱上/下拉三态
;   Q3 W4（GPIO21 -> 模块 RXD/DI）通不通               -> T3 低频方波看总线回声
;
; 与 rs485_probe v3 的分工：
;   probe v3 只测「外部有没有在驱动这个脚」（输入侧）；
;   本工程测「我能不能驱动出去」+「驱动出去后下游有没有反应」（输出侧），
;   正是 probe 测不出、而"发送全哑"最需要的两件事。
;
; 独立工程，不引用主源码；测完重新烧回 pio_verify 即可。
; ============================================================================

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600
