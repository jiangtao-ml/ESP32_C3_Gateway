; ============================================================================
; rs485_probe —— 洞洞板焊接体检工程（**只做诊断、不是业务固件**）
;
; 用途：板子焊完 poll_ok 恒 0 / reason 恒 TIMEOUT / RX=0 时，在**没有万用表**
;       的前提下判断 GPIO20 与模块 RO 之间是「导通」「开路」还是「短路」。
;
; 独立性：本工程与 esp32c3_gateway 完全解耦，不引用其源码，烧它只影响板子，
;        不改动任何业务代码。体检完重新烧回 esp32c3_gateway 即可。
;
; 平台：与主工程同代（pioarduino 55.03.311 = Arduino 3.3.11），不吃新依赖。
; ============================================================================

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600
